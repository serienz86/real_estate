name: collect-gupmae
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Python 환경 준비 (PC에 설치된 최신 파이썬 사용)
        run: |
          py -3 -m venv .venv
          .\.venv\Scripts\python -m pip install -r requirements.txt
      - run: .\.venv\Scripts\python collect.py
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
      - name: Commit data.json
        run: |
          git config user.name "gupmae-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          if (Test-Path stations.json) { git add stations.json }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "update data"; git push }
