name: collect-gupmae
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python collect.py
      - name: Commit data.json
        run: |
          git config user.name "gupmae-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "update data"; git push }
